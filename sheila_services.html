<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sheila Arnedillo — Partnership Services</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --white:#FFFFFF; --cream:#F8F7F4; --navy:#1B3A5C; --navy-light:#2A5280;
  --gold:#C9A84C; --gold-light:#E8D5A3; --gold-pale:#FBF7ED;
  --text:#2C2C2C; --text-muted:#6B7280; --border:#E5E0D8;
  --green:#2D6A4F; --green-light:#D8F3DC;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--white);overflow-x:hidden;}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 32px;background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.top-bar-left{display:flex;align-items:center;gap:12px;}
.top-bar-logo{
  font-family:'EB Garamond',serif;font-size:18px;font-style:italic;
  color:var(--navy);text-decoration:none;
}
.top-bar-tagline{font-size:11px;color:var(--text-muted);letter-spacing:0.05em;}
.top-bar-controls{display:flex;align-items:center;gap:8px;}

.toggle-group{display:flex;border:1.5px solid var(--border);border-radius:20px;overflow:hidden;background:var(--cream);}
.toggle-btn{
  font-size:11px;font-weight:500;letter-spacing:0.06em;
  padding:5px 14px;background:transparent;color:var(--text-muted);
  border:none;cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.toggle-btn.active{background:var(--navy);color:white;}
.toggle-btn:hover:not(.active){background:var(--border);color:var(--text);}

/* ── NAV TABS ── */
.tab-nav{
  position:sticky;top:57px;z-index:90;
  display:flex;background:var(--white);
  border-bottom:2px solid var(--border);
}
.tab-btn{
  flex:1;padding:18px 24px;font-size:13px;font-weight:500;
  letter-spacing:0.06em;text-transform:uppercase;
  background:transparent;border:none;cursor:pointer;
  color:var(--text-muted);transition:all 0.25s;
  border-bottom:3px solid transparent;margin-bottom:-2px;
  font-family:'Inter',sans-serif;
}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
.tab-btn:hover:not(.active){color:var(--navy);background:var(--cream);}

/* ── TAB CONTENT ── */
.tab-panel{display:none;animation:fadeIn 0.35s ease;}
.tab-panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── HERO ── */
.page-hero{
  padding:80px 24px 60px;text-align:center;
  background:linear-gradient(180deg,var(--cream) 0%,var(--white) 100%);
}
.page-hero-eyebrow{
  font-size:10px;font-weight:600;letter-spacing:0.28em;
  text-transform:uppercase;color:var(--gold);margin-bottom:20px;display:block;
}
.page-hero h1{
  font-family:'EB Garamond',serif;
  font-size:clamp(2.2rem,5vw,4rem);font-weight:400;
  color:var(--navy);line-height:1.2;margin-bottom:16px;
}
.page-hero h1 em{font-style:italic;color:var(--gold);}
.page-hero-sub{
  font-size:16px;font-weight:300;color:var(--text-muted);
  max-width:560px;margin:0 auto;line-height:1.8;
}

/* ── SERVICES GRID ── */
.services-section{padding:60px 24px 100px;}
.services-container{max-width:1080px;margin:0 auto;}
.services-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:48px;}
.services-grid-bottom{display:grid;grid-template-columns:1fr;gap:24px;margin-top:24px;}

.service-card{
  background:var(--white);border:1.5px solid var(--border);
  border-radius:16px;padding:36px 32px;position:relative;
  transition:box-shadow 0.25s,transform 0.25s;overflow:hidden;
}
.service-card:hover{box-shadow:0 12px 48px rgba(27,58,92,0.12);transform:translateY(-3px);}
.service-card.premium{border-color:var(--gold-light);}
.service-card.premium::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
}
.service-card.featured{
  border-color:var(--navy);
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
  color:white;
}
.service-card.free{border-color:var(--green);background:var(--green-light);}

.service-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;font-size:10px;font-weight:600;
  letter-spacing:0.12em;text-transform:uppercase;margin-bottom:20px;
}
.badge-gold{background:var(--gold-pale);color:#8B6914;border:1px solid var(--gold-light);}
.badge-premium{background:rgba(201,168,76,0.15);color:var(--gold-light);border:1px solid rgba(201,168,76,0.3);}
.badge-free{background:rgba(45,106,79,0.12);color:var(--green);border:1px solid rgba(45,106,79,0.25);}

.service-title{
  font-family:'EB Garamond',serif;font-size:1.7rem;font-weight:400;
  line-height:1.2;margin-bottom:10px;
}
.service-card.featured .service-title{color:white;}
.service-title em{font-style:italic;color:var(--gold);}
.service-card.featured .service-title em{color:var(--gold-light);}

.service-price{
  display:flex;align-items:baseline;gap:6px;margin-bottom:8px;
}
.price-amount{
  font-family:'EB Garamond',serif;font-size:2.4rem;font-weight:400;color:var(--navy);
}
.service-card.featured .price-amount{color:white;}
.service-card.free .price-amount{color:var(--green);font-size:1.6rem;}
.price-note{font-size:12px;color:var(--text-muted);font-weight:400;}
.service-card.featured .price-note{color:rgba(255,255,255,0.6);}

.service-fit{
  font-size:13px;font-weight:400;color:var(--text-muted);
  line-height:1.7;margin-bottom:24px;padding-bottom:24px;
  border-bottom:1px solid var(--border);
}
.service-card.featured .service-fit{color:rgba(255,255,255,0.7);border-bottom-color:rgba(255,255,255,0.15);}
.service-card.free .service-fit{border-bottom-color:rgba(45,106,79,0.2);}

.service-section-title{
  font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;display:block;
}
.service-card.featured .service-section-title{color:var(--gold-light);}
.service-card.free .service-section-title{color:var(--green);}

.service-list{list-style:none;margin-bottom:24px;}
.service-list li{
  font-size:14px;font-weight:300;color:var(--text-muted);
  line-height:1.6;padding:5px 0 5px 20px;position:relative;
}
.service-card.featured .service-list li{color:rgba(255,255,255,0.75);}
.service-list li::before{
  content:'—';position:absolute;left:0;color:var(--gold);font-weight:400;
}
.service-card.featured .service-list li::before{color:var(--gold-light);}
.service-card.free .service-list li::before{color:var(--green);}

.service-limits{
  background:var(--cream);border-radius:10px;padding:16px 18px;margin-top:8px;
}
.service-card.featured .service-limits{background:rgba(0,0,0,0.15);}
.service-card.free .service-limits{background:rgba(45,106,79,0.08);}
.service-limits p{font-size:13px;color:var(--text-muted);line-height:1.7;}
.service-card.featured .service-limits p{color:rgba(255,255,255,0.6);}

.deliverables-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.deliverable-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 10px;background:var(--cream);border-radius:8px;
}
.service-card.featured .deliverable-item{background:rgba(255,255,255,0.08);}
.service-card.free .deliverable-item{background:rgba(45,106,79,0.08);}
.deliverable-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.deliverable-text{font-size:12px;color:var(--text-muted);line-height:1.5;font-weight:300;}
.service-card.featured .deliverable-text{color:rgba(255,255,255,0.65);}

/* custom quote banner */
.custom-banner{
  background:var(--navy);border-radius:16px;padding:32px 36px;
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;margin-top:40px;flex-wrap:wrap;
}
.custom-banner-text h3{
  font-family:'EB Garamond',serif;font-size:1.5rem;color:white;margin-bottom:6px;
}
.custom-banner-text p{font-size:14px;color:rgba(255,255,255,0.65);line-height:1.7;max-width:560px;}


/* ── FLOW SECTION ── */
.flow-section{padding:60px 24px 100px;}
.flow-container{max-width:900px;margin:0 auto;}
.flow-intro{margin-bottom:60px;}
.flow-intro h2{
  font-family:'EB Garamond',serif;font-size:clamp(1.8rem,4vw,3rem);
  font-weight:400;color:var(--navy);line-height:1.25;margin-bottom:16px;
}
.flow-intro h2 em{font-style:italic;color:var(--gold);}
.flow-intro p{font-size:16px;font-weight:300;color:var(--text-muted);line-height:1.85;max-width:620px;}

/* TIMELINE */
.timeline{position:relative;padding-left:0;}
.timeline::before{
  content:'';position:absolute;left:28px;top:0;bottom:0;
  width:2px;background:linear-gradient(180deg,var(--gold) 0%,var(--border) 100%);
}
.timeline-step{
  display:flex;gap:28px;margin-bottom:0;position:relative;
}
.timeline-step:last-child .step-body{border-bottom:none;padding-bottom:0;}

.step-indicator{
  flex-shrink:0;width:58px;display:flex;flex-direction:column;align-items:center;
  padding-top:4px;
}
.step-number{
  width:38px;height:38px;border-radius:50%;
  background:var(--navy);color:white;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;z-index:1;position:relative;
  flex-shrink:0;
}
.step-number.gold{background:var(--gold);color:var(--navy);}
.step-number.zero{background:var(--cream);color:var(--navy);border:2px solid var(--border);}

.step-body{
  flex:1;padding-bottom:40px;
}
.step-label{
  font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:6px;display:block;
}
.step-title{
  font-family:'EB Garamond',serif;font-size:1.4rem;font-weight:400;
  color:var(--navy);margin-bottom:10px;line-height:1.3;
}
.step-desc{font-size:14px;font-weight:300;color:var(--text-muted);line-height:1.8;margin-bottom:16px;}

.step-detail{
  background:var(--cream);border-radius:10px;padding:16px 18px;
}
.step-detail-title{
  font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:10px;
}
.step-detail ul{list-style:none;}
.step-detail ul li{
  font-size:13px;font-weight:300;color:var(--text-muted);
  padding:3px 0 3px 16px;position:relative;line-height:1.6;
}
.step-detail ul li::before{content:'·';position:absolute;left:4px;color:var(--gold);font-size:16px;line-height:1.2;}

.step-highlight{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;
  margin-top:8px;
}
.highlight-gold{background:var(--gold-pale);color:#8B6914;}
.highlight-navy{background:#EEF3F8;color:var(--navy);}
.highlight-green{background:var(--green-light);color:var(--green);}

/* connector arrows between major phases */
.phase-divider{
  display:flex;align-items:center;gap:16px;
  margin:8px 0 8px 0;padding-left:58px;
}
.phase-divider-line{flex:1;height:1px;background:var(--border);}
.phase-divider-label{
  font-size:10px;font-weight:600;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--text-muted);white-space:nowrap;
}

/* commission box */
.commission-box{
  background:var(--navy);border-radius:14px;padding:28px 28px;margin-top:48px;
}
.commission-box h3{
  font-family:'EB Garamond',serif;font-size:1.4rem;color:white;margin-bottom:8px;
}
.commission-box p{font-size:14px;color:rgba(255,255,255,0.65);line-height:1.75;margin-bottom:16px;}
.commission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.commission-item{
  background:rgba(255,255,255,0.07);border-radius:10px;
  padding:16px;text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}
.commission-item .ci-label{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;}
.commission-item .ci-value{font-family:'EB Garamond',serif;font-size:1.5rem;color:var(--gold-light);}

/* section dividers */
.section-label-block{margin-bottom:40px;}
.section-label-block .eyebrow{
  font-size:10px;font-weight:600;letter-spacing:0.25em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;display:block;
}
.section-label-block h2{
  font-family:'EB Garamond',serif;font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:400;color:var(--navy);line-height:1.25;
}
.section-label-block h2 em{font-style:italic;color:var(--gold);}

/* REVEAL */
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.65s ease,transform 0.65s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal-d1{transition-delay:0.08s;}
.reveal-d2{transition-delay:0.16s;}
.reveal-d3{transition-delay:0.24s;}

/* RESPONSIVE */
@media(max-width:768px){
  .top-bar{padding:10px 16px;flex-wrap:wrap;gap:8px;}
  .top-bar-tagline{display:none;}
  .services-grid{grid-template-columns:1fr;}
  .deliverables-grid{grid-template-columns:1fr;}
  .commission-grid{grid-template-columns:1fr 1fr;}
  .timeline::before{left:19px;}
  .step-indicator{width:40px;}
  .step-number{width:30px;height:30px;font-size:11px;}
  .phase-divider{padding-left:40px;}
  .custom-banner{flex-direction:column;}
  .tab-btn{font-size:11px;padding:14px 12px;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
  <div class="top-bar-left">
    <a class="top-bar-logo" href="#">Sheila Arnedillo</a>
    <span class="top-bar-tagline t" data-en="Travel Advisor at Fora · Partnership Services" data-es="Travel Advisor en Fora · Servicios de Partnership"></span>
  </div>
  <div class="top-bar-controls">
    <div class="toggle-group" id="currency-toggle">
      <button class="toggle-btn active" onclick="setCurrency('eur')" id="btn-eur">€ EUR</button>
      <button class="toggle-btn" onclick="setCurrency('usd')" id="btn-usd">$ USD</button>
      <button class="toggle-btn" onclick="setCurrency('gbp')" id="btn-gbp">£ GBP</button>
    </div>
    <div class="toggle-group" id="lang-toggle">
      <button class="toggle-btn active" onclick="setLang('en')" id="btn-en">EN</button>
      <button class="toggle-btn" onclick="setLang('es')" id="btn-es">ES</button>
    </div>
  </div>
</header>

<!-- TAB NAV -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('services')" id="tab-services">
    <span class="t" data-en="Our Services" data-es="Servicios"></span>
  </button>
  <button class="tab-btn" onclick="showTab('flow')" id="tab-flow">
    <span class="t" data-en="How It Works" data-es="Cómo Funciona"></span>
  </button>
</nav>

<!-- ══════════════════════════════════════════════
     TAB 1 — SERVICES
══════════════════════════════════════════════ -->
<div class="tab-panel active" id="panel-services">

  <div class="page-hero">
    <span class="page-hero-eyebrow t" data-en="Wedding Partner Services" data-es="Servicios para Wedding Planners"></span>
    <h1><span class="t" data-en="Three ways I can " data-es="Tres formas en las que "></span><em><span class="t" data-en="help your couples." data-es="puedo ayudar a tus clientes."></span></em></h1>
    <p class="page-hero-sub t"
      data-en="Two honeymoon planning services designed for couples who want more than a generic itinerary — and one complementary service for your wedding guest logistics."
      data-es="Dos servicios de planificación de luna de miel para parejas que quieren algo más que un itinerario genérico — y un servicio gratuito para la gestión de hoteles de tus invitados.">
    </p>
  </div>

  <section class="services-section">
    <div class="services-container">

      <div class="services-grid">

        <!-- SERVICE 1 -->
        <div class="service-card premium reveal">
          <span class="service-badge badge-gold">
            ✦ <span class="t" data-en="Honeymoon Planning" data-es="Luna de Miel"></span>
          </span>
          <h2 class="service-title t"
            data-en="Bespoke Honeymoon <em>Planning</em>"
            data-es="Planificación de Luna de Miel <em>a Medida</em>">
          </h2>
          <div class="service-price">
            <span class="price-amount" data-eur="€1,500" data-usd="$1,700" data-gbp="£1,300">€1,500</span>
            <span class="price-note t" data-en="fixed planning fee" data-es="tarifa fija de planificación"></span>
          </div>
          <p class="service-fit t"
            data-en="Best for couples planning a honeymoon in one country, 7–14 nights, who want a complete and personalised experience without overly complex logistics."
            data-es="Ideal para parejas que quieren planificar su luna de miel en un solo país, 7–14 noches, con una experiencia completa y personalizada sin logística compleja.">
          </p>

          <span class="service-section-title t" data-en="What's included" data-es="Qué incluye"></span>
          <ul class="service-list">
            <li class="t" data-en="60-minute discovery call + onboarding questionnaire" data-es="Llamada de 60 minutos + cuestionario de bienvenida"></li>
            <li class="t" data-en="Route and pace design based on their priorities and style" data-es="Diseño de ruta y ritmo según sus prioridades y estilo"></li>
            <li class="t" data-en="Curated hotel selection and eligible bookings through Fora" data-es="Selección de hoteles curada y reservas elegibles a través de Fora"></li>
            <li class="t" data-en="Experience, restaurant and local logistics recommendations" data-es="Recomendaciones de experiencias, restaurantes y logística local"></li>
            <li class="t" data-en="Flight research and options" data-es="Investigación y opciones de vuelos"></li>
            <li class="t" data-en="In-trip assistance for Fora-related emergencies" data-es="Asistencia durante el viaje para emergencias relacionadas con Fora"></li>
            <li class="t" data-en="Visa and entry requirements guidance" data-es="Orientación sobre visados y requisitos de entrada"></li>
          </ul>

          <span class="service-section-title t" data-en="Scope" data-es="Alcance"></span>
          <div class="service-limits">
            <p class="t" data-en="Up to 14 nights · One country · No 24/7 support · International flights not booked · Also applicable to lower-complexity itineraries such as all-inclusive stays, multi-night cruises, or partial trip planning alongside another agency."
               data-es="Hasta 14 noches · Un país · Sin soporte 24/7 · No se reservan vuelos internacionales · También aplicable a itinerarios de menor complejidad como estancias all inclusive, cruceros de varias noches, o la planificación de una parte del viaje junto a otra agencia."></p>
          </div>

          <span class="service-section-title" style="margin-top:20px;" class="t"><span class="t" data-en="Deliverables" data-es="Entregables"></span></span>
          <div class="deliverables-grid">
            <div class="deliverable-item"><span class="deliverable-icon">🗺️</span><span class="deliverable-text t" data-en="Day-by-day itinerary" data-es="Itinerario día a día"></span></div>
            <div class="deliverable-item"><span class="deliverable-icon">🏨</span><span class="deliverable-text t" data-en="Hotel summary with perks" data-es="Resumen de hoteles con perks"></span></div>
            <div class="deliverable-item"><span class="deliverable-icon">📍</span><span class="deliverable-text t" data-en="Interactive map" data-es="Mapa interactivo"></span></div>
            <div class="deliverable-item"><span class="deliverable-icon">✅</span><span class="deliverable-text t" data-en="Pre-trip checklist" data-es="Checklist pre-viaje"></span></div>
            <div class="deliverable-item"><span class="deliverable-icon">📄</span><span class="deliverable-text t" data-en="Visa guidance (if needed)" data-es="Guía de visados (si aplica)"></span></div>
            <div class="deliverable-item"><span class="deliverable-icon">📱</span><span class="deliverable-text t" data-en="Digital travel document" data-es="Documento digital de viaje"></span></div>
          </div>
        </div>

        <!-- SERVICE 2 -->
        <div class="service-card featured reveal reveal-d1">
          <span class="service-badge badge-premium">
            ✦✦ <span class="t" data-en="Extended Planning" data-es="Planificación Extendida"></span>
          </span>
          <h2 class="service-title t"
            data-en="Extended & Multi-Country <em>Honeymoon</em>"
            data-es="Luna de Miel Extendida <em>o Multi-Destino</em>">
          </h2>
          <div class="service-price">
            <span class="price-amount" data-eur="€2,500" data-usd="$2,850" data-gbp="£2,150">€2,500</span>
            <span class="price-note t" data-en="fixed planning fee" data-es="tarifa fija de planificación"></span>
          </div>
          <p class="service-fit t"
            data-en="Best for longer or logistically complex honeymoons involving multiple countries, several internal movements, specialist experiences or substantial coordination."

<script>
// ── LANGUAGE ──
var currentLang = 'en';
var currentCurrency = 'eur';

function applyLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.t').forEach(function(el) {
    var val = el.getAttribute('data-' + lang);
    if (val !== null) el.innerHTML = val;
  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  document.documentElement.lang = lang;
}
function setLang(lang) { applyLang(lang); }

// ── CURRENCY ──
function applyCurrency(cur) {
  currentCurrency = cur;
  document.querySelectorAll('.price-amount').forEach(function(el) {
    var val = el.getAttribute('data-' + cur);
    if (val) el.textContent = val;
  });
  document.getElementById('btn-eur').classList.toggle('active', cur === 'eur');
  document.getElementById('btn-usd').classList.toggle('active', cur === 'usd');
  document.getElementById('btn-gbp').classList.toggle('active', cur === 'gbp');
}
function setCurrency(cur) { applyCurrency(cur); }

// ── TABS ──
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // re-trigger reveals for newly visible panel
  setTimeout(triggerReveal, 100);
}

// ── SCROLL REVEAL ──
function triggerReveal() {
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.08 });
  document.querySelectorAll('.reveal:not(.visible)').forEach(function(el) { observer.observe(el); });
}

// Init
applyLang('en');
applyCurrency('eur');
triggerReveal();
</script>
